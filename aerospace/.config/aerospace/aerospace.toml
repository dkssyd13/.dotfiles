# Reference: https://github.com/i3/i3/blob/next/etc/config

# https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

# Start Aerospace at login
start-at-login = true

# Keep the dedicated external-monitor workspace alive even when it is empty.
persistent-workspaces = ['0']

# i3 doesn't have "normalizations" feature that why we disable them here.
# But the feature is very helpful.
# Normalizations eliminate all sorts of weird tree configurations that don't make sense.
# Give normalizations a chance and enable them back.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Possible values : tiles | accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

after-startup-command = [
    # Orange
    # 'exec-and-forget borders active_color=0xffff6b00 inactive_color=0xff494d64 width=8.0 blacklist="iPhone Mirroring"',

    # Light Green 
    # 'exec-and-forget borders active_color=0xff7daea3 inactive_color=0xff494d64 width=8.0 blacklist="iPhone Mirroring"'

    # Blue
    'exec-and-forget borders active_color=0xff89b4fa inactive_color=0xff494d64 width=8.0 blacklist="iPhone Mirroring"',

    # Workspace 2 (terminals) uses a vertical accordion instead of the global 'tiles'
    'layout --workspace 2 --root v_accordion'
]

[gaps]
inner.horizontal = 10
inner.vertical   = 10
outer.left       = 5
outer.bottom     = 5
outer.top        = 5
outer.right      = 5

[mode.main.binding]

    alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
    alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
    alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
    alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-f = 'fullscreen'

    alt-tab = 'workspace-back-and-forth'

    alt-s = 'layout v_accordion' # 'layout stacking' in i3
    alt-w = 'layout h_accordion' # 'layout tabbed' in i3
    alt-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3

    alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Not supported, because this command is redundant in AeroSpace mental model.
    # See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows
    #alt-space = 'focus toggle_tiling_floating'

    # `focus parent`/`focus child` are not yet supported, and it's not clear whether they
    # should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
    # alt-a = 'focus parent'

    alt-backtick = 'workspace 0'
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 10'

    alt-shift-backtick = ['move-node-to-workspace 0 --focus-follows-window']
    alt-shift-1 = ['move-node-to-workspace 1 --focus-follows-window']
    alt-shift-2 = ['move-node-to-workspace 2 --focus-follows-window']
    alt-shift-3 = ['move-node-to-workspace 3 --focus-follows-window']
    alt-shift-4 = ['move-node-to-workspace 4 --focus-follows-window']
    alt-shift-5 = ['move-node-to-workspace 5 --focus-follows-window']
    alt-shift-6 = ['move-node-to-workspace 6 --focus-follows-window']
    alt-shift-7 = ['move-node-to-workspace 7 --focus-follows-window']
    alt-shift-8 = ['move-node-to-workspace 8 --focus-follows-window']
    alt-shift-9 = ['move-node-to-workspace 9 --focus-follows-window']
    alt-shift-0 = ['move-node-to-workspace 10 --focus-follows-window']

    # Move the focused workspace to the previous/next monitor (focus follows).
    alt-shift-leftSquareBracket  = 'move-workspace-to-monitor --wrap-around prev'
    alt-shift-rightSquareBracket = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-comma = 'mode settings'

    # Always open a new Ghostty window (open -a only focuses the existing one).
    # Falls back to plain launch when Ghostty is not running, to avoid a double window.
    alt-shift-enter = ["exec-and-forget pgrep -xq ghostty && osascript -e 'tell application \"Ghostty\" to activate window (new window)' || open -a Ghostty"]
    alt-shift-i = ['exec-and-forget open -a "IntelliJ IDEA"', 'mode main']
    alt-shift-c = ['exec-and-forget open -a "Cursor.app"', 'mode main']
    alt-shift-v = ['exec-and-forget open -a "Visual Studio Code.app"', 'mode main']
    alt-shift-p = ['exec-and-forget open -a "PyCharm.app"', 'mode main']
    alt-shift-f = ['exec-and-forget open -a "Finder"', 'mode main']
    alt-shift-b = ['exec-and-forget open -a "Google Chrome"', 'mode main']
    alt-shift-n = ['exec-and-forget open -a "Notion.app"', 'mode main']
    alt-shift-a = ['exec-and-forget open -a "Claude.app"', 'mode main']
    alt-shift-g = ['exec-and-forget open -a "ChatGPT.app"', 'mode main']
    alt-shift-z = ['exec-and-forget open -a "ZenNotes.app"', 'mode main']
    alt-shift-m = ['exec-and-forget open -a "KakaoTalk.app"', 'mode main']
    # Launch Stickies and bring its notes to the workspace where the shortcut was pressed.
    alt-shift-q = ['''exec-and-forget
        target_workspace=$(/opt/homebrew/bin/aerospace list-workspaces --focused) || exit 1
        [ -n "$target_workspace" ] || exit 1
        /usr/bin/open -g -b com.apple.Stickies || exit 1

        # On first launch, wait for AeroSpace to discover the restored notes.
        for attempt in {1..50}; do
            stickies_windows=$(/opt/homebrew/bin/aerospace list-windows \
                --monitor all --app-bundle-id com.apple.Stickies \
                --format '%{window-id}') || exit 1
            [ -n "$stickies_windows" ] && break
            /bin/sleep 0.1
        done
        [ -n "$stickies_windows" ] || exit 0

        first_window_id=''
        while IFS= read -r window_id; do
            /opt/homebrew/bin/aerospace layout --window-id "$window_id" floating || continue
            /opt/homebrew/bin/aerospace move-node-to-workspace \
                --window-id "$window_id" "$target_workspace" || continue
            [ -n "$first_window_id" ] || first_window_id="$window_id"
        done <<< "$stickies_windows"
        [ -n "$first_window_id" ] && /opt/homebrew/bin/aerospace focus --window-id "$first_window_id"
    ''', 'mode main']


[workspace-to-monitor-force-assignment]
    # Reference material: iPad -> MacBook -> secondary -> main.
    0 = ['sidecar', 'built-in', 'secondary', 'main']

[mode.settings.binding]
    h = 'resize width +50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width -50'

    # Orange
    # b = ['exec-and-forget borders active_color=0xffff6b00 inactive_color=0xff494d64 width=8.0 blacklist="iPhone Mirroring"', 'mode main']

    # Light Green 
    # b = ['exec-and-forget borders active_color=0xff7daea3 inactive_color=0xff494d64 width=8.0 blacklist="iPhone Mirroring"', 'mode main']

    # Blue
    b = ['exec-and-forget borders active_color=0xff89b4fa inactive_color=0xff494d64 width=8.0 blacklist="iPhone Mirroring"', 'mode main']

    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    backspace = ['close-all-windows-but-current', 'mode main']
    enter = ['reload-config', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    esc = 'mode main'

# Apps to ignore
[[on-window-detected]]
if.app-id = 'com.apple.Stickies'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.riotgames.RiotGames.RiotClient'
run = 'layout floating'

# Browsers to workspace 1
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace 1'

# Terminal to workspace 2
[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = ['move-node-to-workspace 2', 'layout --workspace 2 --root v_accordion']

[[on-window-detected]]
if.app-id =  'com.mitchellh.ghostty'
run = ['move-node-to-workspace 2', 'layout --workspace 2 --root v_accordion']

# Dev : IDE's to workspace 3
[[on-window-detected]]
if.app-id = 'com.jetbrains.pycharm'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.jetbrains.intellij'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.apple.iphonesimulator'
run = ['layout floating', 'move-node-to-workspace 3']

[[on-window-detected]]
if.app-id = 'com.apple.dt.Xcode'
run = 'move-node-to-workspace 3'

# Notes to workspace 4
[[on-window-detected]]
if.app-id = 'notion.id'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.goodnotesapp.x'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.adibhanna.zennotes'
run = 'move-node-to-workspace 4'

# AI's to workspace 5
[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = 'move-node-to-workspace 5'

# Finder to workspace 6
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'move-node-to-workspace 6'

# Messengers to workspace 10
[[on-window-detected]]
if.app-id = 'com.kakao.KakaoTalkMac'
run = ['layout floating', 'move-node-to-workspace 10']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['layout floating', 'move-node-to-workspace 10']

[[on-window-detected]]
if.app-id = 'com.apple.ScreenContinuity'
run = ['layout floating', 'move-node-to-workspace 10']
