onboarding = false
[ui.toast]
delivery = "terminal"

[keys]
prefix = "ctrl+a"
switch_tab = ["prefix+1..9", "alt+1..9"]
switch_workspace = ["prefix+ctrl+1..9", "ctrl+1..9"]
# focus_agent = "prefix+alt+1..9"
navigate_workspace_up = ["k", "up"]
navigate_workspace_down = ["j", "down"]

[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "~/.config/herdr/new-tab-from-first-layout.sh"
description = "New tab: Main workspace(75%) + AI agent(25%)"

[[keys.command]]
key = "prefix+shift+v"
type = "shell"
command = "\"${HERDR_BIN_PATH}\" pane split \"${HERDR_ACTIVE_PANE_ID}\" --direction right --ratio 0.75 --no-focus"
description = "Split pane: Main 75% + AI agent 25%"

[theme]
name = "catppuccin"
auto_switch = false
